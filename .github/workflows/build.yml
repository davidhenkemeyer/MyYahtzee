name: Build Windows exe
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake -S . -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/TripleYahtzee.exe, build/dice.wav, build/Click.wav dist/
          if (Test-Path MyYahtzee/Scores.bin) { Copy-Item MyYahtzee/Scores.bin dist/ }
      - uses: actions/upload-artifact@v4
        with:
          name: TripleYahtzee-win
          path: dist/
      - name: Zip
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive dist/* TripleYahtzee-win.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            TripleYahtzee-win.zip
            dist/TripleYahtzee.exe
